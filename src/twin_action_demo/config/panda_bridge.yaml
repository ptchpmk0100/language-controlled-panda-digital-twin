# ros_gz_bridge config_file format. Each entry is one topic mapping, and
# `direction` is the spelled-out form of the bracket used in inline specs:
# GZ_TO_ROS is '[', ROS_TO_GZ is ']'.
#
# Eight mappings: one measurement coming out, seven commands going in.

# --- FEEDBACK: gz -> ROS. Note the type asymmetry: Gazebo emits a whole Model
# --- message and ROS wants a JointState. The bridge knows that conversion.
- ros_topic_name: "/world/empty/model/panda/joint_state"
  gz_topic_name: "/world/empty/model/panda/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# --- COMMANDS: ROS -> gz, one per actuated arm joint.
- ros_topic_name: "/panda_joint1/cmd_pos"
  gz_topic_name: "/panda_joint1/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/panda_joint2/cmd_pos"
  gz_topic_name: "/panda_joint2/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/panda_joint3/cmd_pos"
  gz_topic_name: "/panda_joint3/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/panda_joint4/cmd_pos"
  gz_topic_name: "/panda_joint4/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/panda_joint5/cmd_pos"
  gz_topic_name: "/panda_joint5/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/panda_joint6/cmd_pos"
  gz_topic_name: "/panda_joint6/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/panda_joint7/cmd_pos"
