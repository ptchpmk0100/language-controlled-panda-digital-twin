# Controller configuration, loaded by the controller_manager that
# gz_ros2_control starts inside the simulator.
#
# Two logical sections: a registry naming each controller and its type, then
# per-controller configuration keyed by those same names.
#
# Naming a controller here does NOT start it. A spawner has to load and
# activate it, which is why `ros2 control list_controllers` is empty until the
# spawners in panda_bringup.launch.py have run.

controller_manager:
  ros__parameters:
    # Follow Gazebo's clock rather than the wall clock. This is per-node and
    # defaults to false: being hosted inside the simulator does not make a node
    # infer sim-time, it has to be told. robot_state_publisher is told
    # separately in the launch file, because a split clock breaks TF.
    use_sim_time: true

    # Hz. The rate of the control loop itself, independent of the simulator's
    # physics step.
    update_rate: 1000

    # --- registry: name -> type ---
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Named arm_controller rather than after its type: MoveIt's configuration
    # refers to controllers by name, and this is the name that seam expects.
    # Note the package namespace - joint_trajectory_controller, not
    # position_controllers.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# --- per-controller configuration ---
# Still no PID gains. The trajectory controller interpolates between waypoints
# and writes positions to the command interface; GazeboSimSystem closes the
# loop. Gains would return only on an effort or velocity interface.
#
# Unlike the group position controller it replaced, the trajectory controller
# needs its interfaces declared: it reads state to track where it is along the
# trajectory, not just to report it.
arm_controller:
  ros__parameters:
    # Order defines the joint ordering the controller expects.
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
